; PlatformIO project for Hermes Voice Terminal firmware (M5Stack StickS3).
;
; Two environments:
;   native   - host-testable business logic (state machine, button)
;              behind the hardware seam (include/hardware.h), linked against
;              test/fakes/hw_fakes.c. No ESP-IDF, no device needed. This is
;              the CI/plan gate: `pio test -e native` must pass.
;   esp32dev - real target build (ESP32-PICO-D4). audio_playback.c and
;              board_sticks3.c are ESP-IDF-only and excluded from native.
;              board_sticks3.c currently #error's on hw_button_raw/
;              GPIO wiring until pins are confirmed against the
;              M5Stack ATOM Echo datasheet (see include/board_sticks3.h) -
;              so this env is expected to fail to build until that's done;
;              it is not gated by this plan.

[platformio]
default_envs = native

[env:sticks3]
platform = espressif32@6.13.0
platform_packages =
    framework-espidf @ 3.50503.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 1500000
; StickS3 exposes native USB CDC; reset toggling drops /dev/ttyACM0.
; Enter download mode manually, then keep the port open while uploading.
upload_flags =
    --before=no_reset
    --after=no_reset
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
    -DVOICE_WITH_MAIN
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; Private values are supplied through HERMES_WIFI_SSID/HERMES_WIFI_PASSWORD
    ; in the invoking environment and are never committed to this file.
    -DVOICE_WIFI_SSID=\"${sysenv.HERMES_WIFI_SSID}\"
    -DVOICE_WIFI_PASSWORD=\"${sysenv.HERMES_WIFI_PASSWORD}\"
    -DVOICE_GATEWAY_URL=\"${sysenv.HERMES_GATEWAY_URL}\"

[env:native]
platform = native
test_framework = unity
build_flags = -DUNIT_TEST
; test/test_audio_playback/ is ESP-IDF-only (needs esp_err.h, freertos/);
; skip it for the host build.
test_ignore = test_audio_playback
test_build_src = yes
build_src_filter =
    +<*>
    -<audio_playback.c>
    -<audio_capture.c>
    -<audio_sticks3.c>
    -<board_sticks3.c>
