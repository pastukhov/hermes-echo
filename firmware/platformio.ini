; PlatformIO project for Hermes Voice Terminal firmware (M5Stack ATOM Echo).
;
; Two environments:
;   native   - host-testable business logic (state machine, button, LED)
;              behind the hardware seam (include/hardware.h), linked against
;              test/fakes/hw_fakes.c. No ESP-IDF, no device needed. This is
;              the CI/plan gate: `pio test -e native` must pass.
;   esp32dev - real target build (ESP32-PICO-D4). audio_playback.c and
;              board_atom_echo.c are ESP-IDF-only and excluded from native.
;              board_atom_echo.c currently #error's on hw_button_raw/
;              hw_led_write until their GPIO pins are confirmed against the
;              M5Stack ATOM Echo datasheet (see include/board_atom_echo.h) -
;              so this env is expected to fail to build until that's done;
;              it is not gated by this plan.

[platformio]
default_envs = native

[env:esp32dev]
platform = espressif32
board = m5stack-atom
framework = espidf

[env:native]
platform = native
test_framework = unity
build_flags = -DUNIT_TEST
; test/test_audio_playback/ is ESP-IDF-only (needs esp_err.h, freertos/);
; skip it for the host build.
test_ignore = test_audio_playback
test_build_src = yes
build_src_filter =
    +<*>
    -<audio_playback.c>
    -<audio_capture.c>
    -<board_atom_echo.c>
